blueprint:
  name: OPNsense - Alertes WAN et latence
  description: >-
    Prévient quand le WAN d'OPNsense tombe, quand il revient, ou quand la
    latence vers internet reste élevée. Par défaut, une notification
    persistante est créée dans Home Assistant ; remplace l'action par une
    notification mobile si tu préfères. Les variables `title` et `message`
    sont disponibles dans tes actions.
  domain: automation
  author: spaghiari
  source_url: https://github.com/spaghiari/ha-opnsense/blob/main/blueprints/automation/opnsense_custom/opnsense_alerts.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    sensors:
      name: Capteurs OPNsense
      icon: mdi:shield-lock
      input:
        wan_sensor:
          name: WAN connecté
          description: Capteur binaire « WAN connecté » de l'intégration OPNsense.
          selector:
            entity:
              integration: opnsense_custom
              domain: binary_sensor
              device_class: connectivity
        latency_sensor:
          name: Latence WAN
          description: >-
            Capteur « Latence WAN » (nécessite le privilège OPNsense
            « Status: Gateways »).
          selector:
            entity:
              integration: opnsense_custom
              domain: sensor
              device_class: duration
    settings:
      name: Réglages
      icon: mdi:tune
      collapsed: true
      input:
        wan_down_delay:
          name: Délai avant alerte WAN coupé
          description: Évite les fausses alertes lors d'une micro-coupure.
          default:
            minutes: 1
          selector:
            duration: {}
        notify_recovery:
          name: Prévenir au retour du WAN
          default: true
          selector:
            boolean: {}
        latency_threshold:
          name: Seuil de latence
          default: 100
          selector:
            number:
              min: 10
              max: 1000
              step: 10
              unit_of_measurement: ms
              mode: slider
        latency_duration:
          name: Durée au-dessus du seuil
          default:
            minutes: 5
          selector:
            duration: {}
    notification:
      name: Notification
      icon: mdi:bell-ring
      input:
        alert_actions:
          name: Actions d'alerte
          description: >-
            Exécutées à chaque alerte. Utilise {{ title }} et {{ message }}
            dans tes notifications.
          default:
            - action: persistent_notification.create
              data:
                notification_id: opnsense_alert
                title: "{{ title }}"
                message: "{{ message }}"
          selector:
            action: {}

mode: queued
max: 5

variables:
  latency_entity: !input latency_sensor
  threshold: !input latency_threshold
  title: >-
    {{ {'wan_down': '🔴 OPNsense : WAN coupé',
        'wan_up': '🟢 OPNsense : WAN rétabli',
        'latency_high': '🟠 OPNsense : latence élevée'}[trigger.id] }}
  message: >-
    {% if trigger.id == 'wan_down' %}
    La connexion internet est coupée depuis {{ as_timestamp(trigger.to_state.last_changed) | timestamp_custom('%H:%M') }}.
    {% elif trigger.id == 'wan_up' %}
    La connexion internet est revenue à {{ now().strftime('%H:%M') }}.
    {% else %}
    Latence WAN à {{ states(latency_entity) | float(0) | round(1) }} ms (seuil {{ threshold }} ms).
    {% endif %}

triggers:
  - trigger: state
    id: wan_down
    entity_id: !input wan_sensor
    to: "off"
    for: !input wan_down_delay
  - trigger: state
    id: wan_up
    entity_id: !input wan_sensor
    from: "off"
    to: "on"
    enabled: !input notify_recovery
  - trigger: numeric_state
    id: latency_high
    entity_id: !input latency_sensor
    above: !input latency_threshold
    for: !input latency_duration

actions: !input alert_actions
